<!DOCTYPE html>
<html>
    <head>
        <title> Opacity in html</title>
        <style>
            div {
                background-color: yellow;
                padding : 10px;
            }
            div.first {
                opacity: 0.1;
            }
            div.second {
                opacity : 0.3;
            }
            div.third {
                opacity : 0.6;
            }
        </style>
    </head>
        <body>
            <h1> opacity property</h1>
            <p> this is how this property looks </p>
            <div class="first"> This is the first div element. <p> opacity: 0.1 </p> </div>
            <div class="second"> This is the second div element. <p> opacity: 0.3 </p> </div>
            <div class="third"> This is the third div element. <p> opacity: 0.6 </p> </div>
            <div> <p> opacity: 1.0  defult </p> </div>
        </body>
</html>
