<!DOCTYPE html>
<html>
    <head>
        <title> CSS float example </title>
        <style>
            img#imageRight {
                float: right;
            }
            img#imageLeft {
                float: left;
            }
        </style>
    </head>
        <body>
            <h1> My school logo</h1>
            <p> My school logo has a note book inside with a bookmark with a circle background </p>
            <p> <img id="imageRight" src="My_school_photo.png" alt="Right Image" width="100px" height="100px">
              <img id="imageLeft" src="My_school_photo.png" alt="Left Image" width="100px" height="100px"> 
            this is the dummy content used to show the effect of the float property </p>
        </body>
</html>
