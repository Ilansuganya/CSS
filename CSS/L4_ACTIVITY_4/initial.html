<!DOCTYPE HTML>
<html>
    <head>
        <title> Shadow</title>
        <style>
            * {
                text-align: center;
                font-family: monospace;
            }
            #text {
                text-shadow: 2px 2px 1px red;
            }
            #box {
                box-shadow: 9px 9px 5px blue;
            }
            #indent {
                text-indent: 50%;
            }
        </style>
    </head>
    <body>
        <h1 id="text"> Welcome to Codingal </h1>
         <h1 id="box"> Welcome to Codingal </h1>
         <div>
            <p> This an example of text indent </p>
            <p id="indent"> This an example of text indent </p>        
         </div>
</html>
