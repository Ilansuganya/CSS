<!DOCTYPE html>
<html>
    <head>
        <title> CSS box model example </title>
        <style>
            .rectangle1 {
                width : 220px;
                background-color : red;
                padding : 0px;
                border : 0px;
                margin : 0px;
            }
            .rectangle2 {
                width : 220px;
                background-color : blue;
                padding : 50px;
                border : 5px solid black; 
                margin : 40px 20px;
            }
            hr {
                background-color : green;
            }
        </style>
    </head>
        <body>
            <h1> box model example </h1>
            <hr>
            <p class="rectangle1"> This is a rectangle. </p>
            <hr style = "width: 10%; height : 10px; color : rgb(255, 0, 0);">
            <p class="rectangle2"> This is a rectangle2. </p>
            <hr style = "width: 20%; height : 1px; color : rgba(255, 0, 0, 0.685);">
        </body>
</html>
