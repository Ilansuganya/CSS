<!DOCTYPE HTML>
<html>
    <head>
        <title> Postitoning </title>
        <style>
            div {
                right : 30px;
                border : 3px solid red
            }
            div.absolute {
                position : absolute;
                left : 50px;
                border : 3px solid blue
            }
            div.relative {
                position : relative;
                left : 100px;
                border : 3px solid green
            }
            div.fixed {
                position : fixed;
                top : 0px;
                right : 20px;
                border : 3px solid yellow
            }
            div.sticky {
                position : sticky;
                top : 1px;
                left : 20px;
                width : 100px;
                border : 3px solid black
            }
        </style>
    </head>
        <body>
            <h2> Position </h2>
            <div> div with no position property </div>
            <div class="sticky"> div with sticky position property </div>
            <div class="relative"> div element has position relative </div>
            <div class="absolute"> Absolute div class </div>
            <div class="fixed"> Fixed div class </div>

            <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
            <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
            <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
        </body>
</html>
