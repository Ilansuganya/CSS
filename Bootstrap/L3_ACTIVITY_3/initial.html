<!DOCTYPE html>
    <html>
    <head> <title> border and container </title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    </head>
        <body>
            <div class ="container border border-dark p-3 my-3">
            <h1> Hello World </h1>
            <p> This is a simple paragraph. </p>
            </div>
            <div class ="container p-3 mb-5 bg-primary text-warning">
            <h1> Hello World in color </h1>
            <p> This is a simple paragraph.in color </p>
            </div>
            <div class ="container p-3 my-3 bg-danger text-primary">
            <h1> Hello World in color </h1>
            <p> This is a simple paragraph.in color </p>
            </div>
    </body>
</html>
